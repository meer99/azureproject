trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - uat
      - prod

variables:
  resourceGroup: 'rg-ae-revbc'
  templateFile: 'main.bicep'
  parametersFile: 'parameters/parameters.json'
  tagsFile: 'parameters/tags.json'
  # sqlAdminPassword must be defined as a secret pipeline variable or linked from an Azure Key Vault variable group

stages:
  - stage: Validate
    displayName: 'Validate Bicep Template'
    jobs:
      - job: ValidateBicep
        displayName: 'Validate Bicep'
        steps:
          - task: AzureCLI@2
            displayName: 'Build Bicep Template'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az bicep build --file $(templateFile)

          - task: AzureCLI@2
            displayName: 'Validate Deployment'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                TAGS_JSON=$(jq --arg env "${{ parameters.environment }}" '. + {"Environment": $env}' $(tagsFile))
                az deployment group validate \
                  --resource-group $(resourceGroup) \
                  --template-file $(templateFile) \
                  --parameters $(parametersFile) \
                  --parameters environment="${{ parameters.environment }}" \
                  --parameters tags="$TAGS_JSON" \
                  --parameters sqlAdminPassword="$(sqlAdminPassword)"

  - stage: Deploy
    displayName: 'Deploy to ${{ parameters.environment }}'
    dependsOn: Validate
    jobs:
      - deployment: DeployInfra
        displayName: 'Deploy Infrastructure'
        environment: '${{ parameters.environment }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Deploy Bicep Template'
                  inputs:
                    azureSubscription: 'azure-service-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      TAGS_JSON=$(jq --arg env "${{ parameters.environment }}" '. + {"Environment": $env}' $(tagsFile))
                      az deployment group create \
                        --resource-group $(resourceGroup) \
                        --template-file $(templateFile) \
                        --parameters $(parametersFile) \
                        --parameters environment="${{ parameters.environment }}" \
                        --parameters tags="$TAGS_JSON" \
                        --parameters sqlAdminPassword="$(sqlAdminPassword)" \
                        --name "deploy-${{ parameters.environment }}-$(Build.BuildId)" \
                        --verbose
